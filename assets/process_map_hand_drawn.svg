<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #faf8f5; font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;">
  <defs>
    <filter id="paper-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="1.5" result="light">
        <feDistantLight azimuth="45" elevation="60" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748" />
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e53e3e" />
    </marker>
  </defs>

  <!-- Sheet Background -->
  <rect x="15" y="15" width="930" height="590" rx="12" fill="#fffefb" stroke="#e2d8c3" stroke-width="2" />
  
  <!-- Title & Metadata -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-size="22" font-weight="bold" fill="#1a202c" letter-spacing="0.5">PROCESS MAP: APEX CORRUGATED PACKAGING (Order-to-Delivery)</text>
    <text x="0" y="24" font-size="13" fill="#718096">Audited on: 15 Oct 2026 | Unit: Shed 42, Mayapuri Ph-II | Traced by: Solutions Engineer Candidate</text>
    <line x1="0" y1="36" x2="880" y2="36" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- Legend -->
  <g transform="translate(680, 25)">
    <rect x="0" y="0" width="200" height="42" rx="6" fill="#f7fafc" stroke="#e2e8f0" />
    <circle cx="15" cy="14" r="5" fill="#4299e1" />
    <text x="26" y="18" font-size="11" fill="#4a5568">Physical Step</text>
    <circle cx="105" cy="14" r="5" fill="#ed8936" />
    <text x="116" y="18" font-size="11" fill="#4a5568">Info / Tool</text>
    <circle cx="15" cy="30" r="5" fill="#e53e3e" />
    <text x="26" y="34" font-size="11" fill="#e53e3e" font-weight="bold">Failure Bottleneck</text>
  </g>

  <!-- Flowchart Nodes -->
  
  <!-- Step 1: Customer Order -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="150" height="110" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2" />
    <text x="12" y="24" font-size="14" font-weight="bold" fill="#2b6cb0">1. Order Intake</text>
    <text x="12" y="44" font-size="11" fill="#4a5568">• 65% WhatsApp text/pic</text>
    <text x="12" y="60" font-size="11" fill="#4a5568">• 25% Phone Call</text>
    <text x="12" y="76" font-size="11" fill="#4a5568">• 10% Walk-in sample</text>
    <rect x="8" y="86" width="134" height="18" rx="4" fill="#bee3f8" />
    <text x="14" y="99" font-size="10" font-weight="bold" fill="#2c5282">Actor: Vikas (Owner)</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 190 165 L 230 165" fill="none" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Job Card Generation -->
  <g transform="translate(235, 110)">
    <rect x="0" y="0" width="150" height="110" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" />
    <text x="12" y="24" font-size="14" font-weight="bold" fill="#c05621">2. Job Slip &amp; Die</text>
    <text x="12" y="44" font-size="11" fill="#4a5568">• Hand-written Parchi</text>
    <text x="12" y="60" font-size="11" fill="#4a5568">• Check shelf for block</text>
    <text x="12" y="76" font-size="11" fill="#4a5568">• Whiteboard entry</text>
    <rect x="8" y="86" width="134" height="18" rx="4" fill="#feebc8" />
    <text x="14" y="99" font-size="10" font-weight="bold" fill="#7b341e">Actor: Dinesh (Supervisor)</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 385 165 L 425 165" fill="none" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: Corrugation & Sheet Making -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="155" height="110" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2" />
    <text x="12" y="24" font-size="14" font-weight="bold" fill="#276749">3. Corrugation</text>
    <text x="12" y="44" font-size="11" fill="#4a5568">• Kraft paper reels issued</text>
    <text x="12" y="60" font-size="11" fill="#4a5568">• Steam fluting (3/5 ply)</text>
    <text x="12" y="76" font-size="11" fill="#4a5568">• Sheet rotary cutting</text>
    <rect x="8" y="86" width="139" height="18" rx="4" fill="#c6f6d5" />
    <text x="14" y="99" font-size="10" font-weight="bold" fill="#22543d">Actor: Ram Milan (Operator)</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 585 165 L 625 165" fill="none" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4: Printing & Slotting (CRITICAL BOTTLENECK) -->
  <g transform="translate(630, 95)">
    <rect x="0" y="0" width="170" height="140" rx="10" fill="#fff5f5" stroke="#e53e3e" stroke-width="2.5" stroke-dasharray="0" />
    <text x="12" y="24" font-size="14" font-weight="bold" fill="#c53030">4. Flexo Printing</text>
    <text x="12" y="44" font-size="11" fill="#4a5568">• Stereo rubber plate fit</text>
    <text x="12" y="60" font-size="11" fill="#4a5568">• Ink mixing &amp; slotting</text>
    <rect x="8" y="72" width="154" height="38" rx="4" fill="#fed7d7" />
    <text x="12" y="86" font-size="10" font-weight="bold" fill="#9b2c2c">⚠️ MAIN FAILURE POINT:</text>
    <text x="12" y="100" font-size="9.5" fill="#742a2a">Old plate used; WhatsApp MRP</text>
    <rect x="8" y="115" width="154" height="18" rx="4" fill="#e2e8f0" />
    <text x="14" y="128" font-size="10" font-weight="bold" fill="#2d3748">Actor: Flexo Master (Bablu)</text>
  </g>

  <!-- Down & Left Connector: Step 4 -> Step 5 -->
  <path d="M 715 235 L 715 285 L 80 285 L 80 335" fill="none" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 5: Die-Punching & Stitching -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="165" height="115" rx="10" fill="#f7fafc" stroke="#4a5568" stroke-width="2" />
    <text x="12" y="24" font-size="14" font-weight="bold" fill="#2d3748">5. Punching &amp; Stitch</text>
    <text x="12" y="44" font-size="11" fill="#4a5568">• Flatbed die punch</text>
    <text x="12" y="60" font-size="11" fill="#4a5568">• Semi-auto wire stitch</text>
    <text x="12" y="76" font-size="11" fill="#4a5568">• Cold glue flap seam</text>
    <rect x="8" y="90" width="149" height="18" rx="4" fill="#edf2f7" />
    <text x="14" y="103" font-size="10" font-weight="bold" fill="#2d3748">Actor: Stitching Team (4 wks)</text>
  </g>

  <!-- Connector 5 -> 6 -->
  <path d="M 205 397 L 255 397" fill="none" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 6: QC, Bundling & Staging -->
  <g transform="translate(260, 340)">
    <rect x="0" y="0" width="160" height="115" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="2" />
    <text x="12" y="24" font-size="14" font-weight="bold" fill="#6b46c1">6. Bundling &amp; Staging</text>
    <text x="12" y="44" font-size="11" fill="#4a5568">• 25-box plastic strap</text>
    <text x="12" y="60" font-size="11" fill="#4a5568">• Count vs Job Slip tally</text>
    <text x="12" y="76" font-size="11" fill="#4a5568">• Staged at gate area</text>
    <rect x="8" y="90" width="144" height="18" rx="4" fill="#e9d8fd" />
    <text x="14" y="103" font-size="10" font-weight="bold" fill="#553c9a">Actor: Dinesh (Supervisor)</text>
  </g>

  <!-- Connector 6 -> 7 -->
  <path d="M 420 397 L 470 397" fill="none" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 7: Tempo Loading & Gate Pass -->
  <g transform="translate(475, 340)">
    <rect x="0" y="0" width="165" height="115" rx="10" fill="#fffaf0" stroke="#d69e2e" stroke-width="2" />
    <text x="12" y="24" font-size="14" font-weight="bold" fill="#b7791f">7. Loading &amp; Dispatch</text>
    <text x="12" y="44" font-size="11" fill="#4a5568">• Shared Tata Ace tempo</text>
    <text x="12" y="60" font-size="11" fill="#4a5568">• Hand-written Chalan</text>
    <text x="12" y="76" font-size="11" fill="#4a5568">• WhatsApp driver photo</text>
    <rect x="8" y="90" width="149" height="18" rx="4" fill="#fefcbf" />
    <text x="14" y="103" font-size="10" font-weight="bold" fill="#744210">Actor: Driver &amp; Gate Watchman</text>
  </g>

  <!-- Connector 7 -> 8 -->
  <path d="M 640 397 L 690 397" fill="none" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 8: Billing & Payment Recovery -->
  <g transform="translate(695, 340)">
    <rect x="0" y="0" width="165" height="115" rx="10" fill="#f0fff4" stroke="#319795" stroke-width="2" />
    <text x="12" y="24" font-size="14" font-weight="bold" fill="#285e61">8. Invoicing &amp; Dues</text>
    <text x="12" y="44" font-size="11" fill="#4a5568">• Driver returns signed POD</text>
    <text x="12" y="60" font-size="11" fill="#4a5568">• Tally Prime GST Invoice</text>
    <text x="12" y="76" font-size="11" fill="#4a5568">• 30-45 day credit follow-up</text>
    <rect x="8" y="90" width="149" height="18" rx="4" fill="#b2f5ea" />
    <text x="14" y="103" font-size="10" font-weight="bold" fill="#234e52">Actor: Munshi Sharma Ji</text>
  </g>

  <!-- Bottom Breakdown Banner -->
  <g transform="translate(40, 485)">
    <rect x="0" y="0" width="880" height="105" rx="8" fill="#edf2f7" stroke="#cbd5e0" />
    <text x="15" y="24" font-size="13" font-weight="bold" fill="#2d3748">KEY OPERATIONAL VULNERABILITIES IDENTIFIED IN AUDIT:</text>
    
    <text x="15" y="48" font-size="11" fill="#c53030" font-weight="bold">1. Artwork Version Disconnect:</text>
    <text x="210" y="48" font-size="11" fill="#4a5568">Customer WhatsApp updates stay on owner's phone. Shop floor runs old physical plates (₹18k-₹32k loss/event).</text>
    
    <text x="15" y="68" font-size="11" fill="#c53030" font-weight="bold">2. Invisible Work-in-Progress:</text>
    <text x="210" y="68" font-size="11" fill="#4a5568">Neither owner nor Munshi knows if order is at corrugator, printer, or stitching without physical walk to floor.</text>
    
    <text x="15" y="88" font-size="11" fill="#c53030" font-weight="bold">3. Gate Blindspot:</text>
    <text x="210" y="88" font-size="11" fill="#4a5568">Tempo departs with partial loads without live update; billing delayed until driver physically returns signed chalan.</text>
  </g>
</svg>
