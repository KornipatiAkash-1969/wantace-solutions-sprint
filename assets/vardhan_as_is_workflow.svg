<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="danger-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" font-size="22" font-weight="800" fill="#0f172a">VARDHAN STEELWARE — AS-IS ORDER &amp; DISPATCH WORKFLOW</text>
    <text x="0" y="24" font-size="13" fill="#64748b">Current Operational Gaps, Disconnected Silos, and "Atka Maal" Blindspots in Jagadhri, Haryana</text>
    <line x1="0" y1="36" x2="920" y2="36" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Swimlane 1: Customer & Sales (Kunal) -->
  <rect x="40" y="90" width="920" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="55" y="115" font-size="12" font-weight="700" fill="#334155">SWIMLANE 1: ORDER INTAKE (KUNAL / DISTRIBUTORS / ONLINE)</text>

  <!-- Step 1.1: Order arrival -->
  <g transform="translate(70, 130)">
    <rect x="0" y="0" width="160" height="65" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="10" y="20" font-size="12" font-weight="700" fill="#1e3a8a">Order Arrival</text>
    <text x="10" y="38" font-size="10.5" fill="#475569">WhatsApp / Phone /</text>
    <text x="10" y="52" font-size="10.5" fill="#475569">Amazon / Flipkart</text>
  </g>

  <!-- Arrow 1.1 -> 1.2 -->
  <path d="M 230 162 L 275 162" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#flow-arrow)" />

  <!-- Step 1.2: Google Sheet Entry (Defect prone) -->
  <g transform="translate(280, 122)">
    <rect x="0" y="0" width="220" height="78" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <text x="10" y="20" font-size="12" font-weight="700" fill="#92400e">Kunal's Google Sheet</text>
    <text x="10" y="36" font-size="10" fill="#b45309">⚠️ Duplicates entered (Gupta, Jain)</text>
    <text x="10" y="50" font-size="10" fill="#b45309">⚠️ Missing party / kg vs pcs confusion</text>
    <text x="10" y="66" font-size="10" fill="#b45309">⚠️ Negative rows for returns</text>
  </g>

  <!-- Swimlane 2: Factory Floor & Polishing (Ramesh & Jobworkers) -->
  <rect x="40" y="230" width="920" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="55" y="255" font-size="12" font-weight="700" fill="#334155">SWIMLANE 2: FACTORY PRODUCTION &amp; OUTSOURCED POLISHING (RAMESH)</text>

  <!-- Step 2.1: Shop Floor Production -->
  <g transform="translate(70, 275)">
    <rect x="0" y="0" width="160" height="70" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text x="10" y="20" font-size="12" font-weight="700" fill="#0f172a">Deep Drawing &amp; Press</text>
    <text x="10" y="38" font-size="10.5" fill="#475569">Raw steel utensils pressed</text>
    <text x="10" y="52" font-size="10" fill="#dc2626">No ERP entry; in Ramesh head</text>
  </g>

  <!-- Arrow down from Sheet to Ramesh Diary -->
  <path d="M 390 200 L 390 270" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#danger-arrow)" />
  <text x="400" y="240" font-size="10" fill="#ef4444" font-weight="bold">WhatsApp chats / Verbal</text>

  <!-- Step 2.2: Ramesh Paper Diary -->
  <g transform="translate(280, 275)">
    <rect x="0" y="0" width="170" height="70" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="10" y="20" font-size="12" font-weight="700" fill="#991b1b">Ramesh's Physical Diary</text>
    <text x="10" y="38" font-size="10.5" fill="#7f1d1d">Single point of truth on floor</text>
    <text x="10" y="54" font-size="10" fill="#b91c1c">Not accessible to Suresh/Kunal</text>
  </g>

  <!-- Arrow 2.1 -> 2.2 -->
  <path d="M 230 310 L 275 310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#flow-arrow)" />

  <!-- Arrow 2.2 -> 2.3 (Outsourced Polishing) -->
  <path d="M 450 310 L 515 310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#flow-arrow)" />

  <!-- Step 2.3: The Polishing Black Hole -->
  <g transform="translate(520, 265)">
    <rect x="0" y="0" width="220" height="85" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <text x="10" y="20" font-size="12" font-weight="700" fill="#9a3412">Outsourced Polishing (4-5 Karigars)</text>
    <text x="10" y="38" font-size="10" fill="#c2410c">Sent by weight (KG), returned by count (PCS)</text>
    <text x="10" y="54" font-size="10" fill="#dc2626">⚠️ "Pappu ko 420 kg diya, 1180 pcs aaye"</text>
    <text x="10" y="70" font-size="10" fill="#dc2626">⚠️ 6 kg shortage recorded late in WhatsApp</text>
  </g>

  <!-- Arrow 2.3 -> 2.4 (Return to dispatch floor) -->
  <path d="M 740 310 L 785 310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#flow-arrow)" />

  <!-- Step 2.4: Packing & Staging -->
  <g transform="translate(790, 275)">
    <rect x="0" y="0" width="150" height="70" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text x="10" y="20" font-size="12" font-weight="700" fill="#0f172a">Wiping &amp; Box Pack</text>
    <text x="10" y="38" font-size="10.5" fill="#475569">Patila sets, Kadhais</text>
    <text x="10" y="52" font-size="10" fill="#d97706">Partial lot dispatch common</text>
  </g>

  <!-- Swimlane 3: Accounts & Management (Munshi Ji & Suresh) -->
  <rect x="40" y="480" width="920" height="170" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="55" y="505" font-size="12" font-weight="700" fill="#334155">SWIMLANE 3: ACCOUNTS &amp; VISIBILITY (MUNSHI JI &amp; SURESH VARDHAN)</text>

  <!-- Munshi Ji Box -->
  <g transform="translate(70, 520)">
    <rect x="0" y="0" width="220" height="110" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" />
    <text x="10" y="20" font-size="12" font-weight="700" fill="#0e7490">Munshi Ji (Tally &amp; Credit)</text>
    <text x="10" y="38" font-size="10" fill="#475569">• Tally Prime ledger entries</text>
    <text x="10" y="54" font-size="10" fill="#b91c1c">• Halts dispatch for dues (Sharma ₹1.8L)</text>
    <text x="10" y="70" font-size="10" fill="#475569">• Manually calculates metal loss</text>
    <text x="10" y="86" font-size="10" fill="#b91c1c">⚠️ No sync between Tally &amp; Google Sheet</text>
  </g>

  <!-- Suresh Phone Bottleneck -->
  <g transform="translate(360, 520)">
    <rect x="0" y="0" width="260" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" />
    <text x="10" y="20" font-size="13" font-weight="800" fill="#991b1b">Suresh (Owner - 58 yrs)</text>
    <text x="10" y="38" font-size="10.5" fill="#7f1d1d">"Mujhe bas phone pe dekhna hai kaunsa</text>
    <text x="10" y="52" font-size="10.5" fill="#7f1d1d">order kahan atka hai."</text>
    <text x="10" y="72" font-size="10" fill="#991b1b" font-weight="bold">CURRENT ROUTINE: Has to call Ramesh 15x/day</text>
    <text x="10" y="88" font-size="10" fill="#475569">Distributors call Suresh when orders get stuck</text>
  </g>

  <!-- Double arrow: Suresh calling Ramesh -->
  <path d="M 440 520 L 440 350" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#danger-arrow)" />
  <text x="445" y="440" font-size="10.5" fill="#dc2626" font-weight="bold">"Ramesh! Sharma ka gilas kahan hai?"</text>

  <!-- Final Dispatch Step -->
  <g transform="translate(680, 520)">
    <rect x="0" y="0" width="250" height="110" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="10" y="20" font-size="12" font-weight="700" fill="#15803d">Tempo Loading &amp; Dispatch</text>
    <text x="10" y="38" font-size="10" fill="#475569">• Bilti / manual chalan issued</text>
    <text x="10" y="54" font-size="10" fill="#15803d">• Sent to 40 North India distributors</text>
    <text x="10" y="72" font-size="10" fill="#dc2626">⚠️ Row 9 dispatched with blank customer!</text>
    <text x="10" y="88" font-size="10" fill="#475569">• Partial dispatches recorded in new rows</text>
  </g>

  <!-- Connect 2.4 down to Dispatch -->
  <path d="M 865 350 L 865 520" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#flow-arrow)" />
</svg>
